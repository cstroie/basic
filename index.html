<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC Emulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-size: 12px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #3498db;
            text-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }

        .emulator-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .emulator-container {
                flex-direction: row;
            }
        }

        .screen-container {
            flex: 1;
            background-color: #1a1a1a;
            border: 3px solid #7f8c8d;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        #screen {
            background-color: #000;
            color: #00ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            line-height: 1.6;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .keyboard-container {
            flex: 1;
            background-color: #34495e;
            border: 3px solid #7f8c8d;
            border-radius: 5px;
            padding: 15px;
        }

        .input-area {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }

        #commandInput {
            flex: 1;
            background-color: #2c3e50;
            border: 1px solid #7f8c8d;
            color: #ecf0f1;
            padding: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }

        #runButton, #clearButton {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }

        #runButton:hover, #clearButton:hover {
            background-color: #2980b9;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .key {
            background-color: #7f8c8d;
            color: #000;
            border: none;
            padding: 10px 5px;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            border-radius: 3px;
            font-size: 8px;
        }

        .key:hover {
            background-color: #95a5a6;
        }

        .key.special {
            background-color: #e74c3c;
            color: white;
        }

        .key.special:hover {
            background-color: #c0392b;
        }

        .key.function {
            background-color: #f39c12;
            color: white;
        }

        .key.function:hover {
            background-color: #d35400;
        }

        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background-color: #2c3e50;
            border: 1px solid #7f8c8d;
            font-size: 10px;
        }

        .examples {
            margin-top: 20px;
            background-color: #34495e;
            padding: 15px;
            border-radius: 5px;
        }

        .examples h3 {
            margin-bottom: 10px;
            color: #3498db;
            font-size: 14px;
        }

        .examples ul {
            padding-left: 20px;
        }

        .examples li {
            margin-bottom: 5px;
            font-size: 10px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            font-size: 8px;
            color: #bdc3c7;
        }

        /* Mobile optimizations */
        @media (max-width: 767px) {
            .keyboard {
                grid-template-columns: repeat(4, 1fr);
            }
            
            #screen {
                font-size: 10px;
                height: 250px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .key {
                padding: 8px 3px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .keyboard {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .input-area {
                flex-direction: column;
            }
            
            #lineNumber {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BASIC EMULATOR</h1>
            <p>Emulating classic 8-bit computers</p>
        </header>

        <div class="emulator-container">
            <div class="screen-container">
                <div id="screen">READY.
NEW</div>
                <div class="status-bar">
                    <span id="status">READY</span> | <span id="memory">MEM: 1000</span>
                </div>
            </div>

            <div class="keyboard-container">
                <div class="input-area">
                    <input type="text" id="commandInput" placeholder="Enter BASIC command">
                    <button id="runButton">RUN</button>
                    <button id="clearButton">CLR</button>
                    <button id="saveFileButton">SAVE</button>
                    <button id="loadFileButton">LOAD</button>
                </div>

                <div class="keyboard">
                    <button class="key" data-key="PRINT">PRINT</button>
                    <button class="key" data-key="INPUT">INPUT</button>
                    <button class="key" data-key="LET">LET</button>
                    <button class="key" data-key="GOTO">GOTO</button>
                    <button class="key" data-key="IF">IF</button>
                    <button class="key" data-key="THEN">THEN</button>
                    <button class="key" data-key="FOR">FOR</button>
                    <button class="key" data-key="TO">TO</button>
                    <button class="key" data-key="STEP">STEP</button>
                    <button class="key" data-key="NEXT">NEXT</button>
                    <button class="key" data-key="REM">REM</button>
                    <button class="key" data-key="END">END</button>
                    <button class="key" data-key="LIST">LIST</button>
                    <button class="key" data-key="NEW">NEW</button>
                    <button class="key" data-key="RUN">RUN</button>
                    <button class="key special" data-key="CLS">CLS</button>
                    <button class="key special" data-key="CLR">CLR</button>
                    <button class="key function" data-key="LOAD">LOAD</button>
                    <button class="key function" data-key="SAVE">SAVE</button>
                </div>
            </div>
        </div>

        <div class="examples">
            <h3>Example Programs:</h3>
            <ul>
                <li>10 PRINT "HELLO WORLD"</li>
                <li>20 FOR I = 1 TO 10</li>
                <li>30 PRINT I</li>
                <li>40 NEXT I</li>
                <li>50 END</li>
                <li>Then type RUN to execute</li>
            </ul>
        </div>

        <footer>
            <p>BASIC Emulator - Inspired by ZX Spectrum and Atari 8-bit computers</p>
        </footer>
    </div>

    <script>
        class BasicEmulator {
            constructor() {
                this.program = {};
                this.variables = {};
                this.screen = document.getElementById('screen');
                this.status = document.getElementById('status');
                this.memory = document.getElementById('memory');
                this.commandInput = document.getElementById('commandInput');
                this.runButton = document.getElementById('runButton');
                this.clearButton = document.getElementById('clearButton');
                this.saveFileButton = document.getElementById('saveFileButton');
                this.loadFileButton = document.getElementById('loadFileButton');
                
                this.setupEventListeners();
                this.updateMemory();
            }

            setupEventListeners() {
                // Run button
                this.runButton.addEventListener('click', () => this.runProgram());
                
                // Clear button
                this.clearButton.addEventListener('click', () => this.clearScreen());
                
                // Save file button
                this.saveFileButton.addEventListener('click', () => this.saveProgramToFile());
                
                // Load file button
                this.loadFileButton.addEventListener('click', () => this.loadProgramFromFile());
                
                // Enter key in command input
                this.commandInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.processCommand();
                    }
                });
                
                
                // Keyboard buttons
                document.querySelectorAll('.key').forEach(button => {
                    button.addEventListener('click', () => {
                        const key = button.getAttribute('data-key');
                        this.insertKey(key);
                    });
                });
            }

            insertKey(key) {
                const input = this.commandInput;
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const value = input.value;
                
                // Insert the key at cursor position
                input.value = value.substring(0, start) + key + ' ' + value.substring(end);
                
                // Move cursor to after the inserted text
                const newPos = start + key.length + 1;
                input.setSelectionRange(newPos, newPos);
                input.focus();
            }

            /**
             * Process user input command
             * - If command starts with a number, treat as program line
             * - Otherwise execute as immediate command
             */
            processCommand() {
                let command = this.commandInput.value.trim();
                
                // Check if command starts with a line number
                let actualLineNum = null;
                if (command) {
                    // Extract line number from the beginning of the command
                    const match = command.match(/^(\d+)\s+(.*)/);
                    if (match) {
                        actualLineNum = match[1];
                        command = match[2];
                    }
                }
                
                if (actualLineNum && command) {
                    // Store as program line (convert only keywords to uppercase)
                    const upperCommand = this.convertKeywordsToUppercase(command);
                    this.program[parseInt(actualLineNum)] = upperCommand;
                    this.printToScreen(`${actualLineNum} ${upperCommand}`);
                    this.commandInput.value = '';
                } else if (command) {
                    // Execute immediate command (convert only keywords to uppercase)
                    const upperCommand = this.convertKeywordsToUppercase(command);
                    this.executeCommand(upperCommand);
                    this.commandInput.value = '';
                }
                
                this.updateMemory();
            }

            /**
             * Convert only BASIC keywords and commands to uppercase
             * Preserves case of arguments and string literals
             * @param {string} command - The command to process
             * @returns {string} - Command with keywords in uppercase
             */
            convertKeywordsToUppercase(command) {
                // Split command into tokens
                const tokens = command.split(' ');
                if (tokens.length === 0) return command;
                
                // List of BASIC keywords to convert to uppercase
                const keywords = [
                    'PRINT', 'INPUT', 'LET', 'GOTO', 'IF', 'THEN', 'FOR', 'TO', 'STEP', 
                    'NEXT', 'REM', 'END', 'LIST', 'NEW', 'RUN', 'CLS', 'CLEAR', 'LOAD', 'SAVE'
                ];
                
                // Convert first token (command) if it's a keyword
                if (keywords.includes(tokens[0].toUpperCase())) {
                    tokens[0] = tokens[0].toUpperCase();
                }
                
                // Handle special cases for multi-word commands
                if (tokens.length >= 2) {
                    if (tokens[0].toUpperCase() === 'CLS' && tokens[1].toUpperCase() === 'CLEAR') {
                        tokens[0] = 'CLS';
                        tokens[1] = 'CLEAR';
                    }
                }
                
                return tokens.join(' ');
            }

            /**
             * Execute an immediate command (not part of a program)
             * @param {string} command - The command to execute
             */
            executeCommand(command) {
                // Extract command part and argument part
                let cmdPart = command;
                let argPart = '';
                
                // Find the first space to separate command from arguments
                const firstSpace = command.indexOf(' ');
                if (firstSpace > 0) {
                    cmdPart = command.substring(0, firstSpace);
                    argPart = command.substring(firstSpace + 1);
                }
                
                const upperCmd = cmdPart.toUpperCase();
                
                if (upperCmd === 'NEW') {
                    this.newProgram();
                } else if (upperCmd === 'LIST') {
                    this.listProgram();
                } else if (upperCmd === 'RUN') {
                    this.runProgram();
                } else if (upperCmd === 'CLS' || upperCmd === 'CLEAR') {
                    this.clearScreen();
                } else if (upperCmd === 'PRINT') {
                    this.executePrint(argPart);
                } else if (upperCmd === 'LET') {
                    this.executeLet(argPart);
                } else if (upperCmd === 'SAVE') {
                    this.saveProgram(argPart || 'default');
                } else if (upperCmd === 'LOAD') {
                    this.loadProgram(argPart || 'default');
                } else if (upperCmd === 'REM') {
                    // Comment - do nothing
                } else if (upperCmd === 'END') {
                    this.printToScreen("END");
                } else {
                    this.printToScreen(`?SYNTAX ERROR`);
                }
                
                this.status.textContent = 'READY';
            }

            /**
             * Execute PRINT command
             * Handles string literals and variable references
             * @param {string} expression - The expression to print
             */
            /**
             * Execute PRINT command
             * Handles string literals, variables, expressions, and comma-separated lists
             * @param {string} expression - The expression to print
             */
            executePrint(expression) {
                // Handle comma-separated expressions
                const parts = expression.split(',');
                let output = '';
                
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i].trim();
                    
                    if (part.startsWith('"') && part.endsWith('"')) {
                        // String literal - preserve case
                        output += part.substring(1, part.length - 1);
                    } else if (part === '') {
                        // Empty part (from trailing comma)
                        output += ' ';
                    } else {
                        // Try to evaluate as expression first
                        const result = this.evaluateExpression(part);
                        if (result !== null) {
                            output += result;
                        } else {
                            // Variable or number
                            const varName = part.toUpperCase(); // Variables should be uppercase
                            if (this.variables[varName] !== undefined) {
                                output += this.variables[varName];
                            } else if (!isNaN(part)) {
                                output += part;
                            } else {
                                output += `?VARIABLE NOT DEFINED`;
                            }
                        }
                    }
                    
                    // Add space between comma-separated parts
                    if (i < parts.length - 1) {
                        output += ' ';
                    }
                }
                
                this.printToScreen(output);
            }

            /**
             * Execute LET command to assign values to variables
             * @param {string} expression - The assignment expression (e.g., "A = 10")
             */
            executeLet(expression) {
                // Simple LET implementation
                const parts = expression.split('=');
                if (parts.length === 2) {
                    const varName = parts[0].trim().toUpperCase(); // Variable names should be uppercase
                    const valueExpr = parts[1].trim();
                    
                    // Try to evaluate value expression
                    if (valueExpr.startsWith('"') && valueExpr.endsWith('"')) {
                        // String - preserve case
                        this.variables[varName] = valueExpr.substring(1, valueExpr.length - 1);
                    } else {
                        // Try to evaluate as arithmetic expression
                        const result = this.evaluateExpression(valueExpr);
                        if (result !== null) {
                            this.variables[varName] = result;
                        } else {
                            this.printToScreen(`?SYNTAX ERROR`);
                            return;
                        }
                    }
                } else {
                    this.printToScreen(`?SYNTAX ERROR`);
                }
            }

            newProgram() {
                this.program = {};
                this.variables = {};
                this.clearScreen();
                this.printToScreen("NEW");
            }

            /**
             * Save program to localStorage with case-insensitive name
             * @param {string} name - Program name (defaults to 'default')
             */
            saveProgram(name = 'default') {
                try {
                    const data = {
                        program: this.program,
                        variables: this.variables
                    };
                    const lowerName = name.toLowerCase();
                    localStorage.setItem(`basic_program_${lowerName}`, JSON.stringify(data));
                    this.printToScreen(`PROGRAM SAVED AS "${name}"`);
                } catch (e) {
                    this.printToScreen(`?SAVE ERROR: ${e.message}`);
                }
            }

            /**
             * Load program from localStorage with case-insensitive name
             * @param {string} name - Program name (defaults to 'default')
             */
            loadProgram(name = 'default') {
                try {
                    const lowerName = name.toLowerCase();
                    const data = localStorage.getItem(`basic_program_${lowerName}`);
                    if (data) {
                        const parsed = JSON.parse(data);
                        this.program = parsed.program || {};
                        this.variables = parsed.variables || {};
                        this.printToScreen(`PROGRAM "${name}" LOADED`);
                        this.updateMemory();
                    } else {
                        this.printToScreen(`?PROGRAM "${name}" NOT FOUND`);
                    }
                } catch (e) {
                    this.printToScreen(`?LOAD ERROR: ${e.message}`);
                }
            }

            listProgram() {
                const lines = Object.keys(this.program)
                    .sort((a, b) => parseInt(a) - parseInt(b))
                    .map(key => `${key} ${this.program[key]}`);
                
                if (lines.length > 0) {
                    lines.forEach(line => this.printToScreen(line));
                } else {
                    this.printToScreen("(EMPTY)");
                }
            }

            /**
             * Run the stored program line by line
             * Executes each line with a small delay for demonstration
             */
            runProgram() {
                this.status.textContent = 'RUNNING';
                this.printToScreen("RUN");
                
                const sortedLines = Object.keys(this.program)
                    .sort((a, b) => parseInt(a) - parseInt(b));
                
                let i = 0;
                const executeLine = () => {
                    if (i >= sortedLines.length) {
                        this.status.textContent = 'READY';
                        this.printToScreen("READY.");
                        return;
                    }
                    
                    const lineNum = sortedLines[i];
                    const command = this.program[lineNum];
                    this.executeProgramLine(lineNum, command);
                    i++;
                    
                    // For demonstration purposes, we'll add a small delay
                    setTimeout(executeLine, 10);
                };
                
                executeLine();
            }

            /**
             * Execute a single line of a stored program
             * @param {string} lineNum - Line number
             * @param {string} command - Command to execute
             */
            executeProgramLine(lineNum, command) {
                // Extract command part and argument part
                let cmdPart = command;
                let argPart = '';
                
                // Find the first space to separate command from arguments
                const firstSpace = command.indexOf(' ');
                if (firstSpace > 0) {
                    cmdPart = command.substring(0, firstSpace);
                    argPart = command.substring(firstSpace + 1);
                }
                
                const upperCmd = cmdPart.toUpperCase();
                
                if (upperCmd === 'PRINT') {
                    this.executePrint(argPart);
                } else if (upperCmd === 'LET') {
                    this.executeLet(argPart);
                } else if (upperCmd === 'INPUT') {
                    this.executeInput(argPart);
                } else if (upperCmd === 'FOR') {
                    this.executeFor(argPart, lineNum);
                } else if (upperCmd === 'NEXT') {
                    this.executeNext();
                } else if (upperCmd === 'REM') {
                    // Comment - do nothing
                } else if (upperCmd === 'GOTO') {
                    this.executeGoto(argPart);
                } else if (upperCmd === 'IF') {
                    this.executeIf(argPart);
                } else if (upperCmd === 'END') {
                    this.printToScreen("END");
                    this.status.textContent = 'READY';
                } else {
                    this.printToScreen(`?SYNTAX ERROR IN LINE ${lineNum}`);
                }
            }

            /**
             * Execute FOR loop command
             * @param {string} expression - Loop definition (e.g., "I = 1 TO 10")
             * @param {string} lineNum - Current line number
             */
            executeFor(expression, lineNum) {
                // Parse FOR expression: variable = start TO end [STEP step]
                const toIndex = expression.toUpperCase().indexOf(' TO ');
                if (toIndex === -1) {
                    this.printToScreen(`?SYNTAX ERROR IN LINE ${lineNum}`);
                    return;
                }
                
                const varPart = expression.substring(0, toIndex).trim();
                let stepPart = '1'; // Default step
                
                // Check for STEP
                const stepIndex = expression.toUpperCase().indexOf(' STEP ');
                let toPart;
                if (stepIndex !== -1) {
                    toPart = expression.substring(toIndex + 4, stepIndex).trim();
                    stepPart = expression.substring(stepIndex + 6).trim();
                } else {
                    toPart = expression.substring(toIndex + 4).trim();
                }
                
                // Parse variable assignment
                const equalsIndex = varPart.indexOf('=');
                if (equalsIndex === -1) {
                    this.printToScreen(`?SYNTAX ERROR IN LINE ${lineNum}`);
                    return;
                }
                
                const varName = varPart.substring(0, equalsIndex).trim().toUpperCase();
                const startExpr = varPart.substring(equalsIndex + 1).trim();
                
                // Evaluate expressions
                const startValue = this.evaluateExpression(startExpr);
                const toValue = this.evaluateExpression(toPart);
                const stepValue = this.evaluateExpression(stepPart);
                
                if (startValue === null || toValue === null || stepValue === null) {
                    this.printToScreen(`?SYNTAX ERROR IN LINE ${lineNum}`);
                    return;
                }
                
                // Store loop information
                if (!this.loops) this.loops = [];
                this.loops.push({
                    varName: varName,
                    toValue: toValue,
                    stepValue: stepValue,
                    lineNum: parseInt(lineNum)
                });
                
                // Set loop variable
                this.variables[varName] = startValue;
            }

            /**
             * Execute NEXT command to continue loop
             */
            executeNext() {
                if (!this.loops || this.loops.length === 0) {
                    this.printToScreen(`?NEXT WITHOUT FOR`);
                    return;
                }
                
                // Get current loop info
                const loop = this.loops[this.loops.length - 1];
                const varName = loop.varName;
                const currentValue = this.variables[varName];
                
                // Update loop variable
                this.variables[varName] = currentValue + loop.stepValue;
                const newValue = this.variables[varName];
                
                // Check if loop should continue
                let shouldContinue = false;
                if (loop.stepValue > 0) {
                    shouldContinue = newValue <= loop.toValue;
                } else {
                    shouldContinue = newValue >= loop.toValue;
                }
                
                if (!shouldContinue) {
                    // Loop finished, remove from stack
                    this.loops.pop();
                } else {
                    // Jump back to FOR statement
                    // In a real implementation, we'd jump to the line after the FOR
                    // For this demo, we'll just continue normally
                }
            }

            /**
             * Execute GOTO command to jump to a line number
             * @param {string} lineNum - Target line number
             */
            executeGoto(lineNum) {
                const targetLine = parseInt(lineNum.trim());
                if (isNaN(targetLine)) {
                    this.printToScreen(`?SYNTAX ERROR`);
                    return;
                }
                
                // Check if line exists
                if (this.program[targetLine] === undefined) {
                    this.printToScreen(`?UNDEFINED LINE NUMBER`);
                    return;
                }
                
                // In a real implementation, we'd jump to this line
                // For this demo, we'll just acknowledge the command
                this.printToScreen(`GOTO ${targetLine} (JUMP TO LINE ${targetLine})`);
            }

            executeIf(expression) {
                // Parse IF expression: condition THEN command
                const thenIndex = expression.toUpperCase().indexOf(' THEN ');
                if (thenIndex === -1) {
                    this.printToScreen(`?SYNTAX ERROR`);
                    return;
                }
                
                const condition = expression.substring(0, thenIndex).trim();
                const command = expression.substring(thenIndex + 6).trim();
                
                // Evaluate condition (simple numeric comparison)
                if (this.evaluateCondition(condition)) {
                    this.executeCommand(command);
                }
            }

            /**
             * Evaluate a condition for IF statements
             * @param {string} condition - The condition to evaluate
             * @returns {boolean} - True if condition is met
             */
            evaluateCondition(condition) {
                // Handle simple comparisons: A = B, A < B, A > B
                const operators = ['>=', '<=', '<>', '>', '<', '='];
                let operator = '';
                let opIndex = -1;
                
                // Find the operator (check longer ones first)
                for (const op of operators) {
                    opIndex = condition.indexOf(op);
                    if (opIndex !== -1) {
                        operator = op;
                        break;
                    }
                }
                
                if (opIndex === -1) {
                    // Just a single value - check if non-zero
                    const value = this.evaluateExpression(condition);
                    return value !== null && value !== 0;
                }
                
                const leftExpr = condition.substring(0, opIndex).trim();
                const rightExpr = condition.substring(opIndex + operator.length).trim();
                
                const leftValue = this.evaluateExpression(leftExpr);
                const rightValue = this.evaluateExpression(rightExpr);
                
                if (leftValue === null || rightValue === null) {
                    return false;
                }
                
                switch (operator) {
                    case '=': return leftValue === rightValue;
                    case '<>': return leftValue !== rightValue;
                    case '<': return leftValue < rightValue;
                    case '>': return leftValue > rightValue;
                    case '<=': return leftValue <= rightValue;
                    case '>=': return leftValue >= rightValue;
                    default: return false;
                }
            }

            /**
             * Execute INPUT command to get user input
             * @param {string} expression - Variable name to store input
             */
            executeInput(expression) {
                const varName = expression.trim().toUpperCase();
                if (!varName) {
                    this.printToScreen(`?SYNTAX ERROR`);
                    return;
                }
                
                // For this implementation, we'll simulate input with a prompt
                this.printToScreen(`?INPUT ${varName}`);
                // In a real implementation, we'd wait for user input
                // For now, we'll just assign a default value
                this.variables[varName] = 0;
            }

            /**
             * Evaluate arithmetic expressions with variables and numbers
             * @param {string} expr - The expression to evaluate
             * @returns {number|null} - The result or null if invalid
             */
            evaluateExpression(expr) {
                // Handle built-in functions first
                if (expr.toUpperCase().startsWith('RND')) {
                    return Math.random();
                }
                
                if (expr.toUpperCase().startsWith('INT(') && expr.endsWith(')')) {
                    const inner = expr.substring(4, expr.length - 1);
                    const value = this.evaluateExpression(inner);
                    return value !== null ? Math.floor(value) : null;
                }
                
                // Remove spaces
                expr = expr.replace(/\s+/g, '');
                
                // Simple expression evaluator for +, -, *, / operations
                // This is a basic implementation - a full parser would be more complex
                try {
                    // Replace variables with their values
                    let processedExpr = expr;
                    // Match variable names (letters followed by optional letters/digits)
                    const varRegex = /[A-Z][A-Z0-9]*/gi;
                    const matches = expr.match(varRegex) || [];
                    
                    // Replace each variable with its value
                    for (const varName of matches) {
                        const upperVarName = varName.toUpperCase();
                        if (this.variables[upperVarName] !== undefined) {
                            // Replace all instances of this variable with its value
                            processedExpr = processedExpr.replace(
                                new RegExp('\\b' + varName + '\\b', 'gi'), 
                                this.variables[upperVarName]
                            );
                        } else {
                            // Check if it's not a number (undefined variable)
                            if (isNaN(varName)) {
                                return null; // Variable not defined
                            }
                        }
                    }
                    
                    // Evaluate simple arithmetic
                    // This is a very basic implementation using Function constructor
                    // In a production environment, a proper parser would be better
                    try {
                        // Only allow numbers, operators, parentheses, and decimal points
                        if (/[^0-9+\-*/.() ]/.test(processedExpr)) {
                            return null; // Invalid characters
                        }
                        
                        // Handle empty expressions
                        if (processedExpr === '') {
                            return null;
                        }
                        
                        // Evaluate the expression
                        const result = Function('"use strict"; return (' + processedExpr + ')')();
                        return typeof result === 'number' && !isNaN(result) ? result : null;
                    } catch (e) {
                        return null; // Invalid expression
                    }
                } catch (e) {
                    return null;
                }
            }

            printToScreen(text) {
                this.screen.textContent += '\n' + text;
                this.screen.scrollTop = this.screen.scrollHeight;
            }

            clearScreen() {
                this.screen.textContent = 'READY.';
            }

            /**
             * Save the current program to a local file
             */
            saveProgramToFile() {
                try {
                    // Convert program to plain text format
                    const lines = Object.keys(this.program)
                        .sort((a, b) => parseInt(a) - parseInt(b))
                        .map(key => `${key} ${this.program[key]}`);
                    
                    const content = lines.join('\n');
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'basic_program.bas';
                    document.body.appendChild(a);
                    a.click();
                    
                    // Clean up
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                    
                    this.printToScreen("PROGRAM SAVED TO FILE");
                } catch (e) {
                    this.printToScreen(`?SAVE ERROR: ${e.message}`);
                }
            }

            /**
             * Load a program from a local file
             */
            loadProgramFromFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.bas';
                
                input.onchange = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            // Parse the BASIC program lines
                            const content = e.target.result;
                            const lines = content.split('\n');
                            
                            // Clear current program
                            this.program = {};
                            
                            // Parse each line
                            for (const line of lines) {
                                const trimmedLine = line.trim();
                                if (trimmedLine) {
                                    // Extract line number and command
                                    const match = trimmedLine.match(/^(\d+)\s+(.*)/);
                                    if (match) {
                                        const lineNum = parseInt(match[1]);
                                        const command = match[2];
                                        this.program[lineNum] = command;
                                    }
                                }
                            }
                            
                            this.printToScreen("PROGRAM LOADED FROM FILE");
                            this.updateMemory();
                        } catch (err) {
                            this.printToScreen(`?LOAD ERROR: ${err.message}`);
                        }
                    };
                    reader.readAsText(file);
                };
                
                input.click();
            }

            updateMemory() {
                const programSize = JSON.stringify(this.program).length;
                const varSize = JSON.stringify(this.variables).length;
                const total = programSize + varSize;
                this.memory.textContent = `MEM: ${1000 - total}`;
            }
        }

        // Initialize emulator when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const emulator = new BasicEmulator();
        });
    </script>
